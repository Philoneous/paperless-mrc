[project]
name = "paperless-mrc"
version = "0.1.0"
description = "Pre-Consume-Skript für Paperless-ngx: gescannte PDFs per Mixed Raster Content verkleinern"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "archive-pdf-tools>=1.5.7",
    "pikepdf>=10.0",
    "pymupdf>=1.24",
    "numpy",
    "pillow",
]

[project.scripts]
paperless-mrc = "paperless_mrc.main:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
